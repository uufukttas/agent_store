<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GradeUp Agent Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdf9; --surface:#ffffff; --sunk:#f7f3ec; --line:#e7e0d6; --line-strong:#d3c9b9;
  --ink:#1c1917; --ink-2:#57534e; --ink-3:#736c66;
  --accent:#4338ca; --accent-ink:#ffffff; --accent-soft:#eceafc; --accent-line:#c5c1f2;
  --ok:#15803d; --ok-soft:#e5f3e9;
  --warn:#935400; --warn-soft:#fcefd2;
  --err:#b91c1c; --err-soft:#fce9e9;
  --pend:#a3205f; --pend-soft:#fae6f0;
  --cat-model:#4338ca; --cat-search:#57534e; --cat-page:#a5b4fc;
  --shadow:0 12px 40px rgba(28,25,23,.18);
  --f-head:'Sora',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12100e; --surface:#1b1815; --sunk:#0e0c0b; --line:#2d2924; --line-strong:#423c35;
    --ink:#f5f1ea; --ink-2:#bdb5aa; --ink-3:#9a9288;
    --accent:#a5b4fc; --accent-ink:#14123a; --accent-soft:#23233f; --accent-line:#3b3f7a;
    --ok:#4ade80; --ok-soft:#12261a; --warn:#fbbf24; --warn-soft:#2c2209;
    --err:#f87171; --err-soft:#2d1514; --pend:#f0abcf; --pend-soft:#2c1423;
    --cat-model:#a5b4fc; --cat-search:#a8a29e; --cat-page:#4a4f94;
    --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12100e; --surface:#1b1815; --sunk:#0e0c0b; --line:#2d2924; --line-strong:#423c35;
  --ink:#f5f1ea; --ink-2:#bdb5aa; --ink-3:#9a9288;
  --accent:#a5b4fc; --accent-ink:#14123a; --accent-soft:#23233f; --accent-line:#3b3f7a;
  --ok:#4ade80; --ok-soft:#12261a; --warn:#fbbf24; --warn-soft:#2c2209;
  --err:#f87171; --err-soft:#2d1514; --pend:#f0abcf; --pend-soft:#2c1423;
  --cat-model:#a5b4fc; --cat-search:#a8a29e; --cat-page:#4a4f94;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);font-feature-settings:'tnum','cv11';-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;font:600 17px var(--f-head);letter-spacing:-.02em;text-decoration:none}
.brand i{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand small{font:500 12px var(--f-body);color:var(--ink-3);letter-spacing:0;margin-left:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a[aria-disabled="true"]{opacity:.55;cursor:default}
.nav a[aria-disabled="true"]:hover{background:none;color:var(--ink-2)}
.nav .badge{margin-left:auto;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--pend);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center}
.side .grow{flex:1}
.me{display:flex;gap:8px;align-items:center;padding:8px;border-top:1px solid var(--line);margin:0 -12px;padding-inline:20px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.me div{min-width:0;line-height:1.3} .me b{display:block;font-weight:500;font-size:13px} .me span{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;border-bottom:1px solid var(--line)}
.crumb{font-weight:500;color:var(--ink-2);display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.kbtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink-2)}
.kbtn:hover{border-color:var(--ink-3)}
kbd{font:500 11px var(--f-body);padding:1px 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--ink-2)}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink-2)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.page{padding:24px;max-width:1280px;width:100%}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn.danger:hover{background:var(--err-soft);border-color:var(--err)}
.btn kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:inherit}
.btn.primary kbd{color:var(--accent-ink)}
.btn.ok kbd{color:var(--bg)}
.st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap}
.st .ic{width:12px;height:12px;stroke-width:2.2}
.st.running{background:var(--accent-soft);color:var(--accent)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.budget{background:var(--warn-soft);color:var(--warn)}
.st.error{background:var(--err-soft);color:var(--err)}
.st.pending{background:var(--pend-soft);color:var(--pend)}
.st.neutral{background:var(--sunk);color:var(--ink-2)}
.pulse{width:8px;height:8px;border-radius:50%;background:currentColor;position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid currentColor;opacity:0;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.pagehead h1{font-size:22px}
.pagehead p{margin:4px 0 0;color:var(--ink-2)}
.pagehead .sp{flex:1}
.secthead{display:flex;align-items:baseline;gap:12px;margin:32px 0 8px}
.secthead h2{font-size:15px}
.secthead a{margin-left:auto;color:var(--accent);font-weight:500;text-decoration:none}
.secthead a:hover{text-decoration:underline}

.bar{height:6px;border-radius:3px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* ---------- overview ---------- */
.inbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.inbox-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:24px;padding:24px;border-bottom:1px solid var(--line);align-items:center}
.inbox-main h2{font-size:30px;letter-spacing:-.025em}
.inbox-main p{margin:8px 0 16px;color:var(--ink-2);max-width:52ch}
.peek{list-style:none;margin:0;padding:0;border-left:1px solid var(--line);padding-left:24px}
.peek li a{display:flex;gap:12px;align-items:center;padding:8px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.peek li:last-child a{border:0}
.peek li a:hover b{color:var(--accent)}
.peek b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:inline-grid;place-items:center;min-width:32px;height:22px;padding:0 6px;border-radius:6px;background:var(--sunk);font-weight:600;font-size:12px}
.score.hi{background:var(--ok-soft);color:var(--ok)} .score.lo{background:var(--warn-soft);color:var(--warn)}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line)}
.alerts li:last-child{border:0}
.alerts .ic{color:var(--warn)} .alerts .err .ic{color:var(--err)}
.alerts span{flex:1;min-width:0}
.alerts li>span:first-child{flex:none;display:grid}
.alerts a{color:var(--accent);font-weight:500;text-decoration:none;white-space:nowrap}
.alerts a:hover{text-decoration:underline}

.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:32px;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
.metric{padding:16px 20px 16px 0;margin-right:20px;border-right:1px solid var(--line)}
.metric:last-child{border:0;margin:0}
.metric dt{color:var(--ink-2);font-weight:500}
.metric dd{margin:4px 0 0}
.metric .big{font:600 26px/1.2 var(--f-head);letter-spacing:-.025em;display:block}
.metric small{display:block;margin-top:6px;color:var(--ink-3);font-size:12px}
.metric .bar{margin-top:10px}
.delta-ok{color:var(--ok);font-weight:500}
.spark{display:block;margin-top:8px}

.tablewrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--accent-soft)}
td .who b{font-weight:600;display:block} td .who span{color:var(--ink-3);font-size:12px}
.mini{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mini .bar{width:64px}
.mini .bar i{background:var(--accent)} .mini .bar.hot i{background:var(--warn)}

/* ---------- run detail ---------- */
.runhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.runhead h1{font-size:22px}
.runmeta{margin:4px 0 0;color:var(--ink-2)}
.runmeta span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--ink-3);margin:0 8px;vertical-align:middle}
.budget{position:sticky;top:0;z-index:5;margin:20px -24px 0;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.budget-row{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.budget-row .amt{font:600 22px var(--f-head);letter-spacing:-.02em}
.budget-row .of{color:var(--ink-2)}
.budget-row .right{margin-left:auto;color:var(--ink-2)}
.budget .bar{height:10px;border-radius:5px;margin-top:8px;position:relative}
.legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px}
.counts{display:flex;gap:32px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.counts div b{font:600 18px var(--f-head);display:block}
.counts div span{color:var(--ink-2);font-size:12px}
.runbody{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;margin-top:16px;align-items:start}
.filters{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--ink-2);font-weight:500}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative}
.step{display:grid;grid-template-columns:44px 24px minmax(0,1fr) 60px;gap:0 8px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;border-radius:0 8px 8px 0;padding:8px 8px 8px 0}
.step:hover{background:var(--sunk)}
.step[aria-pressed="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.step .t{color:var(--ink-3);font-size:12px;padding-top:2px;text-align:right}
.step .rail{position:relative;display:flex;justify-content:center}
.step .rail::before{content:"";position:absolute;top:-8px;bottom:-8px;width:1px;background:var(--line-strong)}
.tl li:first-child .rail::before{top:14px}
.tl li:last-child .rail::before{bottom:auto;height:22px}
.tl li.live:last-child .rail::before{bottom:-8px;height:auto;background:repeating-linear-gradient(var(--line-strong) 0 4px,transparent 4px 8px)}
.node{position:relative;z-index:1;margin-top:1px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-2)}
.node .ic{width:11px;height:11px;stroke-width:2}
.node.search{color:var(--cat-search)} .node.fetch{color:var(--accent);border-color:var(--accent-line)}
.node.save{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.node.draft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.node.approval{background:var(--pend-soft);color:var(--pend);border-color:transparent}
.node.error{background:var(--err-soft);color:var(--err);border-color:transparent}
.node.live{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.step .what{min-width:0}
.step .what b{font-weight:600;display:block}
.step .what span{color:var(--ink-2);display:block;overflow-wrap:anywhere}
.step .what .tool{font-weight:500;color:var(--ink-3);font-size:12px;margin-right:6px}
.step .cost{text-align:right;color:var(--ink-2);font-size:12px;padding-top:2px}
.step .cost.zero{color:var(--ink-3)}
.panel{position:sticky;top:150px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.panel header{padding:16px;border-bottom:1px solid var(--line)}
.panel header h3{font-size:15px;margin-top:6px}
.panel header .tool{color:var(--ink-3);font-size:12px;font-weight:500}
.panel dl{margin:0;padding:8px 16px}
.panel dl div{padding:8px 0;border-bottom:1px solid var(--line)}
.panel dl div:last-child{border:0}
.panel dt{color:var(--ink-3);font-size:12px}
.panel dd{margin:2px 0 0;overflow-wrap:anywhere}
.panel .src{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--bg)}
.panel .src h4{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--ink-3)}
.srclink{display:flex;gap:8px;align-items:center;padding:6px 0;text-decoration:none;color:var(--accent);font-weight:500;overflow-wrap:anywhere}
.srclink:hover{text-decoration:underline}

/* ---------- approval queue ---------- */
.queue{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:640px;overflow:hidden}
.q-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line)}
.tabs button{height:40px;padding:0 8px;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button span{color:var(--ink-3);margin-left:4px}
.q-items{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.q-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:none;padding:12px 12px 12px 12px}
.q-item:hover{background:var(--sunk)}
.q-item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.q-item .l1{display:flex;gap:8px;align-items:center}
.q-item b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-item .l2{color:var(--ink-2);font-size:12px;margin-top:2px;display:flex;gap:8px}
.q-item .l2 span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-item .l2 span:last-child{white-space:nowrap}
.q-item .l2 span:last-child{margin-left:auto;color:var(--ink-3)}
.q-empty{padding:32px 24px;color:var(--ink-2)}
.q-empty b{display:block;font:600 15px var(--f-head);color:var(--ink);margin-bottom:4px}
.q-draft{display:flex;flex-direction:column;min-width:0}
.q-draft .dh{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.q-draft .dh h2{font-size:17px}
.q-draft .dh p{margin:2px 0 0;color:var(--ink-2)}
.q-draft .back{display:none}
.mail{padding:20px 24px;flex:1}
.mail .subj{font-weight:600;font-size:15px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mail .body{max-width:62ch;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.cite{display:inline;border:0;background:none;padding:0;border-bottom:1.5px dotted var(--accent);cursor:pointer;color:inherit;font:inherit;text-align:inherit}
.cite:hover,.cite.on{background:var(--accent-soft)}
.cite sup{color:var(--accent);font-weight:600;font-size:10px;margin-left:1px}
.mail textarea{width:100%;max-width:62ch;min-height:300px;resize:vertical;padding:12px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);line-height:1.7;font-size:14.5px}
.q-actions{display:flex;gap:8px;padding:12px 24px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap;align-items:center}
.q-actions .note{flex:1;min-width:200px;color:var(--ink-3);font-size:12px}
.reasons{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 24px;border-top:1px solid var(--line);background:var(--err-soft)}
.reasons span{font-weight:500;color:var(--err);margin-right:4px}
.reasons button{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--err);background:var(--surface);color:var(--err);font-weight:500}
.reasons button:hover{background:var(--err);color:var(--bg)}
.decided{margin:0 24px;margin-top:16px;padding:12px 16px;border-radius:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.decided.ok{background:var(--ok-soft);color:var(--ok)} .decided.no{background:var(--err-soft);color:var(--err)}
.decided span{flex:1;min-width:200px}
.q-ctx{border-left:1px solid var(--line);background:var(--bg);padding:16px;overflow:auto;min-width:0}
.q-ctx h3{font-size:13px;margin:0 0 8px}
.q-ctx section+section{margin-top:20px}
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig b{font:700 34px var(--f-head);letter-spacing:-.03em}
.signals{list-style:none;margin:8px 0 0;padding:0}
.signals li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.signals li span{flex:1}
.signals em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.signals em.p{color:var(--ok)} .signals em.n{color:var(--warn)}
.srcbox{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px;font-size:13px}
.srcbox.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.srcbox .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:11px;margin-right:6px}
.srcbox a{color:var(--accent);font-weight:500;text-decoration:none;overflow-wrap:anywhere}
.srcbox a:hover{text-decoration:underline}
.srcbox q{display:block;margin-top:6px;color:var(--ink-2);quotes:none;border-left:2px solid var(--line-strong);padding-left:8px}
.flag{display:flex;gap:8px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;margin-top:8px}
.flag .ic{margin-top:2px}

/* ---------- toast + palette ---------- */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center}
.toast{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);animation:rise .18s ease-out}
.toast button{background:none;border:0;color:var(--accent-line);font-weight:600;padding:0 4px}
:root[data-theme="dark"] .toast button{color:var(--accent)}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
dialog.pal{width:min(560px,calc(100vw - 32px));margin-top:12vh;padding:0;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);overflow:hidden}
dialog.pal::backdrop{background:rgba(20,16,12,.45)}
.pal input{width:100%;height:48px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;font-size:15px;outline:0}
.pal ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.pal li button{display:flex;gap:10px;align-items:center;width:100%;height:36px;padding:0 10px;border:0;border-radius:6px;background:none;text-align:left}
.pal li button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.pal li button span{margin-left:auto;color:var(--ink-3);font-size:12px}
.pal .none{padding:16px;color:var(--ink-2)}

.tabbar{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .queue{grid-template-columns:260px minmax(0,1fr)}
  .q-ctx{display:none}
  .q-ctx.open{display:block;grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .runbody{grid-template-columns:1fr}
  .panel{position:static}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:0 16px}
  .page{padding:16px 16px 88px}
  .budget{margin-inline:-16px;padding-inline:16px}
  .inbox-main{grid-template-columns:1fr;padding:16px}
  .peek{border-left:0;padding-left:0}
  .inbox-main h2{font-size:26px}
  .alerts li{padding-inline:16px}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{border:0;margin:0;padding:16px 8px 16px 0;border-bottom:1px solid var(--line)}
  .kbtn kbd{display:none}
  .queue{grid-template-columns:1fr;min-height:0}
  .queue .q-draft,.queue .q-ctx{display:none}
  .queue.show-detail .q-list{display:none}
  .queue.show-detail .q-draft{display:flex}
  .queue.show-detail .q-ctx{display:block;border-left:0;border-top:1px solid var(--line)}
  .q-list{border-right:0}
  .q-draft .back{display:inline-flex}
  .q-draft .dh,.mail,.q-actions,.reasons{padding-inline:16px}
  .decided{margin-inline:16px}
  .q-actions .note{display:none}
  .step{grid-template-columns:36px 24px minmax(0,1fr) 52px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:12px;font-weight:500;color:var(--ink-2);text-decoration:none;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--pend);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center}
  .toasts{bottom:72px}
}
@media (prefers-reduced-motion:reduce){
  .pulse::after{animation:none}
  .toast{animation:none}
  *{scroll-behavior:auto!important}
}

/* ===== yardımcılar ===== */
function statusChip(s){
  const m = {running:'<span class="pulse"></span>', done:ic('check'), budget:ic('stop'), error:ic('alert'), pending:ic('clock')}[s];
  return `<span class="st ${s}">${m}${T.statuses[s]}</span>`;
}
function toast(msg, undo){
  const el = document.createElement('div'); el.className='toast';
  el.innerHTML = `<span>${msg}</span>` + (undo ? '<button type="button">Geri al</button>' : '');
  if(undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
  $('#toasts').append(el); setTimeout(() => el.remove(), 5000);
}
function scoreCls(n){ return n>=75?'hi':n<65?'lo':''; }
function cum(i){ return STEPS.slice(0,i+1).reduce((a,s)=>a+s.cost,0) + BASE_COST*((i+1)/STEPS.length); }

  const banner = d.status==='approved'
    ? `<div class="decided ok">${ic('check')}<span>Onaylandı. Kopyalayıp kendin gönder; sistem bu taslağı göndermez.</span><button class="btn" type="button" data-act="copy">${ic('copy')}Kopyala</button></div>`
    : d.status==='rejected' ? `<div class="decided no">${ic('x')}<span>Reddedildi: ${d.reason}</span><button class="btn" type="button" data-act="undo">Geri al</button></div>` : '';

    : `<div class="q-actions"><button class="btn ok" type="button" data-act="approve">${ic('check')}Onayla <kbd>A</kbd></button><button class="btn" type="button" data-act="edit">${ic('edit')}Düzenle <kbd>E</kbd></button><button class="btn danger" type="button" data-act="reject">${ic('x')}Reddet <kbd>R</kbd></button><span class="note">Onaylamak göndermek anlamına gelmez.</span></div>`;
  return `

    ${actions}

      ${d.flag?`<div class="flag">${ic('alert')}<span>${d.flag}</span></div>`:''}
    </section>
    <section><h3>Kaynaklar</h3>
      ${d.sources.map(s=>`<div class="srcbox ${S.hot===s.n?'on':''}" id="src${s.n}"><span class="n">${s.n}</span><a href="#" onclick="return false">${s.u}</a><q>${s.q}</q></div>`).join('')}
      <p class="faint" style="font-size:12px;margin:8px 0 0">Metindeki altı noktalı cümleler bu kaynaklara bağlı.</p>
    </section>
  </aside>`;
}
function decide(status, reason){
  const d = DRAFTS.find(x=>x.id===S.sel); if(!d || d.status!=='pending') return;
  const list = DRAFTS.filter(x=>x.status==='pending'); const idx = list.indexOf(d);
  d.status = status; if(reason) d.reason = reason;
  S.edit = S.rejecting = false; S.hot = null;
  const nxt = list[idx+1] || list[idx-1];
  S.sel = nxt && nxt!==d ? nxt.id : d.id;
  if(!DRAFTS.some(x=>x.status===S.qTab && x.id===S.sel)) S.qTab = 'pending';
  S.mobileDetail = false;
  render();
  toast(status==='approved' ? 'Onaylandı' : 'Reddedildi', () => { d.status='pending'; delete d.reason; S.qTab='pending'; S.sel=d.id; render(); });
}
function move(dir){
  const list = DRAFTS.filter(d=>d.status===S.qTab); const i = list.findIndex(d=>d.id===S.sel);
  const n = list[Math.max(0, Math.min(list.length-1, i+dir))]; if(n){ S.sel=n.id; S.edit=S.rejecting=false; S.hot=null; render(); }
}

/* ===== yönlendirme ve olaylar ===== */
function render(){
  renderShell();
  if(S.route==='genel') viewGenel(); else if(S.route==='calisma') viewCalisma(); else viewOnay();
}
function route(){
  const [, r, p] = location.hash.split('/');
  S.route = ['genel','calisma','onay'].includes(r) ? r : 'genel';
  if(S.route==='onay' && p){ const d = DRAFTS.find(x=>x.id==p); if(d){ S.sel=d.id; S.qTab=d.status; S.mobileDetail=true; } }
  if(S.route!=='onay') S.mobileDetail=false;
  S.edit = S.rejecting = false;
  render(); scrollTo(0,0);
}
addEventListener('hashchange', route);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-step],[data-filter],[data-qtab],[data-sel],[data-cite],[data-act],[data-reason]'); if(!t) return;
  const D = t.dataset;
  if(D.go){ location.hash = D.go; return; }
  if(D.step){ S.step = +D.step; render(); return; }
  if(D.filter){ S.filter = D.filter; render(); return; }
  if(D.qtab){ S.qTab = D.qtab; S.sel = null; S.edit=S.rejecting=false; render(); return; }
  if(D.sel){ S.sel = +D.sel; S.edit=S.rejecting=false; S.hot=null; S.mobileDetail=true; render(); return; }
  if(D.cite){ S.hot = +D.cite; render(); $('#src'+S.hot)?.scrollIntoView({block:'nearest'}); return; }
  if(D.reason){ decide('rejected', D.reason); return; }
  const a = D.act, d = DRAFTS.find(x=>x.id===S.sel);
  if(a==='approve') decide('approved');
  else if(a==='reject'){ S.rejecting=true; render(); }
  else if(a==='cancelreject'){ S.rejecting=false; render(); }
  else if(a==='edit'){ S.edit=true; render(); $('#editor')?.focus(); }
  else if(a==='canceledit'){ S.edit=false; render(); }
  else if(a==='saveedit'){ d.body=[[$('#editor').value,0]]; d.signals=d.signals; S.edit=false; render(); toast('Değişiklikler kaydedildi'); }
  else if(a==='copy'){ const txt = draftPlain(d); try{ navigator.clipboard.writeText(txt); }catch(e){} toast('Kopyalandı'); }
  else if(a==='undo'){ d.status='pending'; delete d.reason; S.qTab='pending'; render(); }
  else if(a==='back'){ S.mobileDetail=false; render(); }
  else if(a==='stop') toast('Prototipte çalıştırma durdurulmaz');
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.matches('tr[data-go]')){ location.hash = e.target.dataset.go; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.cite')){ e.preventDefault(); e.target.click(); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPal(); return; }
  const typing = e.target.matches('input,textarea');
  if(e.key==='Escape' && S.route==='onay' && (S.edit||S.rejecting)){ S.edit=S.rejecting=false; render(); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey || S.route!=='onay' || $('#pal').open) return;
  const k = e.key.toLowerCase();
  if(k==='j'||e.key==='ArrowDown'){ if(e.target.closest('.q-items')||k==='j'){ e.preventDefault(); move(1); } }
  else if(k==='k'||e.key==='ArrowUp'){ if(e.target.closest('.q-items')||k==='k'){ e.preventDefault(); move(-1); } }
  else if(k==='a') decide('approved');
  else if(k==='r'){ const d = DRAFTS.find(x=>x.id===S.sel); if(d?.status==='pending'){ S.rejecting=true; render(); } }
  else if(k==='e'){ const d = DRAFTS.find(x=>x.id===S.sel); if(d?.status==='pending'){ e.preventDefault(); S.edit=true; render(); $('#editor')?.focus(); } }
});

/* ===== komut paleti ===== */
const CMDS = [['Genel bakış','#/genel','home'],['Çalıştırma #218 ayrıntısı','#/calisma/218','play'],['Onay kuyruğu','#/onay','check'],['Temayı değiştir',null,'moon']];
let palSel = 0;
function drawPal(){
  const q = $('#palIn').value.trim().toLocaleLowerCase('tr');
  const items = CMDS.filter(c => c[0].toLocaleLowerCase('tr').includes(q));
  palSel = Math.min(palSel, Math.max(0, items.length-1));
  $('#palList').innerHTML = items.length ? items.map((c,i)=>`<li><button type="button" role="option" data-pal="${CMDS.indexOf(c)}" aria-selected="${i===palSel}">${ic(c[2])}${c[0]}<span>${c[1]?'Git':'İşlem'}</span></button></li>`).join('') : '<li class="none">Sonuç yok. Başka bir ekran adı dene.</li>';
  return items;
}
function openPal(){ $('#pal').showModal(); $('#palIn').value=''; palSel=0; drawPal(); $('#palIn').focus(); }
function runPal(c){ $('#pal').close(); if(c[1]) location.hash=c[1]; else $('#theme').click(); }
$('#openPal').onclick = openPal;
$('#palIn').addEventListener('input', () => { palSel=0; drawPal(); });
$('#palIn').addEventListener('keydown', e => {
  const items = drawPal();
  if(e.key==='ArrowDown'){ e.preventDefault(); palSel=Math.min(items.length-1,palSel+1); drawPal(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(0,palSel-1); drawPal(); }
  else if(e.key==='Enter' && items[palSel]){ runPal(items[palSel]); }
});
$('#palList').addEventListener('click', e => { const b = e.target.closest('[data-pal]'); if(b) runPal(CMDS[+b.dataset.pal]); });
$('#pal').addEventListener('click', e => { if(e.target.id==='pal') $('#pal').close(); });

route();
</script>
